[workspace]
resolver = "2"
members = [
    "crates/botmartz-core",
    "crates/botmartz-ast",
    "crates/botmartz-storage",
    "crates/botmartz-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
