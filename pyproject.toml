[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botmartz-engine"
version = "0.1.0"
description = "Botmartz Omni-RAG & Autonomous Generation Engine (H-RAG, JEV Late Chunking, CAG Radix KV-Cache, KAG DuckDB, Merkle Versioning, MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "duckdb>=1.1.0",
    "lancedb>=0.15.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/botmartz_engine"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
