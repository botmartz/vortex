[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botmartz-vortex"
version = "0.3.0"
description = "Botmartz Omni-RAG & Autonomous Generation Engine (H-RAG, JEV Late Chunking, CAG Radix KV-Cache, KAG DuckDB, Merkle Versioning, MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "duckdb>=1.1.0",
    "lancedb>=0.15.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/botmartz_engine"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
